[package]
name = "chessnut-board-support"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
publish = false

[workspace]
resolver = "2"

[dependencies]
chessnut-move = { version = "=1.0.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dependencies.signal-hook]
version = "=0.3.18"
optional = true

[features]
mock-worker = ["dep:signal-hook"]

[[bin]]
name = "mock-worker"
path = "tests/support/mock_worker.rs"
required-features = ["mock-worker"]
test = false

[lints.rust]
unsafe_code = "forbid"
