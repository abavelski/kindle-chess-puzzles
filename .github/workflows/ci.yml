name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
          targets: armv7-unknown-linux-gnueabihf
      - name: Check host code and tests
        run: scripts/check.sh

  kindle-cross-smoke:
    # Scribe firmware 5.19.6 has glibc 2.35; newer runners produced
    # an artifact requiring GLIBC_2.38 that failed before app startup.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Install ARMv7 hard-float cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Cross-build minimal Kindle binary
        run: scripts/check-kindle.sh
      - name: Publish Task 04 checkpoint binary
        uses: actions/upload-artifact@v4
        with:
          name: kindle-chess-task04-armv7
          path: target/armv7-unknown-linux-gnueabihf/debug/kindle-chess
          if-no-files-found: error
          retention-days: 14
