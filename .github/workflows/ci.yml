name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
          targets: armv7-unknown-linux-gnueabihf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install host tooling dependencies
        run: python3 -m pip install -r requirements-tools.txt
      - name: Check host code and tests
        run: scripts/check.sh

  kindle-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: puzzles
          - app: review
          - app: play
    # Zig pins the target glibc baseline to 2.35 independently of runner libc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
          targets: armv7-unknown-linux-gnueabihf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install host tooling dependencies
        run: python3 -m pip install -r requirements-tools.txt
      - name: Build tested pinned Scribe release
        run: scripts/app.sh build ${{ matrix.app }}
      - name: Stage runtime and KPM package
        run: scripts/app.sh stage ${{ matrix.app }}
      - name: Verify selected product artifacts
        run: python3 tools/verify_app_artifacts.py --app ${{ matrix.app }}
      - name: Publish inspectable installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindle-${{ matrix.app }}-armv7-glibc235
          path: |
            target/kindle/${{ matrix.app }}/*.tar
            target/kindle/${{ matrix.app }}/*.kpkg
            target/kindle/${{ matrix.app }}/build.json
          if-no-files-found: error
          retention-days: 14
